name: CI

# Verification only. No deployment, no publishing, no secrets — a workflow that
# can deploy is a workflow that can deploy something broken, and nothing here
# has earned that yet.
#
# The suite is pinned to in-memory SQLite by phpunit.xml. No database service is
# provisioned on purpose: the shipped .env points DB_* at a REMOTE MySQL server
# shared with the institute ERP, and CI must never be able to reach it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.2'
  PHP_EXTENSIONS: mbstring, dom, xmlwriter, pdo_sqlite, sqlite3

jobs:
  # ---------------------------------------------------------------------------
  backend:
    name: Backend test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
      - run: php artisan test

  # ---------------------------------------------------------------------------
  # Named so a red build reads as a statement about the product, not about the
  # test runner. "loop / THE LOOP MUST TURN" in the checks list tells whoever
  # sees it what is actually broken.
  loop:
    name: THE LOOP MUST TURN (golden intelligence flow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
      - name: Signal -> evidence -> reasoning -> decision -> execution -> outcome -> learning -> memory
        # Includes the two honesty checkpoints FBR §3.5 requires: an honest
        # UNKNOWN at step 4 and UNDETERMINED at step 7. If this is red, do not
        # deploy — whatever else is green, the loop is broken.
        run: php artisan test --filter=GoldenIntelligenceFlowTest

  # ---------------------------------------------------------------------------
  routes:
    name: Every route resolves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
      - name: brain:check-routes
        # The gate that would have caught DecisionController::approve() —
        # declared, absent, and fatal on first dispatch.
        run: php artisan brain:check-routes

  # ---------------------------------------------------------------------------
  contracts:
    name: Contracts are not stale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
      - name: Regenerate the OpenAPI schema from routes/api.php
        run: php artisan brain:openapi
      - name: npm install
        working-directory: contracts
        run: npm install --no-audit --no-fund
      - name: npm run check
        working-directory: contracts
        # Regenerates and then `git diff --exit-code`: red means someone changed
        # a route or a schema and did not commit the regenerated contract, so
        # the published types no longer describe the API.
        run: npm run check

  # ---------------------------------------------------------------------------
  # NOTE: web/ is not part of this repository — it is an orphan nested git repo
  # pointing at a different remote (see the Module 9 report and .gitignore).
  # This job therefore only runs when the directory is actually present, which
  # on a normal checkout of THIS repo it is not. It is written now so that it
  # starts working the moment the web/ question is resolved, rather than being
  # forgotten.
  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Is the SPA in this checkout?
        id: probe
        run: |
          if [ -f web/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "present=false" >> "$GITHUB_OUTPUT";
               echo "::notice::web/ is not part of this repository — skipping. See .gitignore."; fi
      - uses: actions/setup-node@v4
        if: steps.probe.outputs.present == 'true'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        if: steps.probe.outputs.present == 'true'
        working-directory: web
        run: npm ci
      - name: npm run build
        if: steps.probe.outputs.present == 'true'
        working-directory: web
        run: npm run build
      - name: npm test
        if: steps.probe.outputs.present == 'true'
        working-directory: web
        run: npm test

  # ---------------------------------------------------------------------------
  status:
    name: Generate docs/STATUS.md
    runs-on: ubuntu-latest
    needs: [backend, loop, routes, contracts]
    # Runs whatever the other jobs did, so a red build still produces an honest
    # status file rather than none. A missing status page and a failing one look
    # identical from a distance; only one of them tells you anything.
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Measure the test suite
        id: tests
        run: |
          set +e
          php artisan test > test-output.txt 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat test-output.txt
          # `Tests:  167 passed (747 assertions)` — parsed rather than assumed.
          echo "passed=$(grep -oP 'Tests:\s+\K\d+(?= passed)' test-output.txt | tail -1)" >> "$GITHUB_OUTPUT"
          echo "failed=$(grep -oP '\K\d+(?= failed)' test-output.txt | tail -1)" >> "$GITHUB_OUTPUT"
          echo "assertions=$(grep -oP '\(\K\d+(?= assertions\))' test-output.txt | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Measure the contract drift
        id: drift
        run: |
          set +e
          php artisan brain:openapi > openapi-output.txt 2>&1
          cd contracts && npm install --no-audit --no-fund > /dev/null 2>&1 && npm run generate > gen.txt 2>&1
          cat gen.txt
          echo "unknown=$(grep -oP 'endpoint that does not exist:\s+\K\d+' gen.txt | tail -1)" >> "$GITHUB_OUTPUT"
          echo "unverified=$(grep -oP 'unverified response bodies:\s+\K\d+' gen.txt | tail -1)" >> "$GITHUB_OUTPUT"

      - name: brain:status
        run: |
          php artisan brain:status \
            --sha="${{ github.sha }}" \
            --tests="${{ steps.tests.outputs.passed || 'unknown' }}" \
            --assertions="${{ steps.tests.outputs.assertions || 'unknown' }}" \
            --failures="${{ steps.tests.outputs.failed || '0' }}" \
            --golden="${{ needs.loop.result == 'success' && 'pass' || 'fail' }}" \
            --drift="${{ steps.drift.outputs.unknown || 'unknown' }}" \
            --unverified="${{ steps.drift.outputs.unverified || 'unknown' }}"
          cat docs/STATUS.md

      - name: Publish the status file as a build artifact
        # An artifact, not a commit. A workflow that writes back to the branch
        # needs write permission, and this one is verification-only by design.
        uses: actions/upload-artifact@v4
        with:
          name: status
          path: docs/STATUS.md
